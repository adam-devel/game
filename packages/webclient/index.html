<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { margin-bottom: 0.5rem; }
    #status {
      font-size: 1.25rem;
      margin: 1rem 0;
      min-height: 2rem;
    }
    canvas {
      border-radius: 8px;
    }
    #restart {
      margin-top: 1rem;
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #e94560;
      color: #fff;
      cursor: pointer;
      display: none;
    }
    #restart:hover { background: #d63651; }
    #log {
      position: fixed;
      bottom: 1rem;
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status"></div>
  <canvas id="canvas"></canvas>
  <button id="restart">Play Again</button>
  <div id="log"></div>
  <script src="https://cdn.jsdelivr.net/npm/msgpack-lite@0.1.26/dist/msgpack.min.js"></script>
  <script type="module" src="./client.js"></script>
  <script>
    document.getElementById('restart').addEventListener('click', () => window.restart());
  </script>
</body>
</html>
